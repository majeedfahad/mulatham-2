<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ملثم">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#151c2c"/>
    </linearGradient>
    <!-- Gold Gradient -->
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#e6c353"/>
    </linearGradient>
    <!-- Purple Accent -->
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#nightSky)" stroke="url(#goldGlow)" stroke-width="8"/>

  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#2a3548" stroke-width="2" stroke-dasharray="10 5"/>

  <!-- Stars -->
  <g filter="url(#starGlow)">
    <circle cx="120" cy="100" r="2" fill="#ffd700" opacity="0.8"/>
    <circle cx="380" cy="80" r="2.5" fill="#fff" opacity="0.7"/>
    <circle cx="90" cy="200" r="1.5" fill="#c0c0c0" opacity="0.6"/>
    <circle cx="420" cy="180" r="2" fill="#ffd700" opacity="0.7"/>
    <circle cx="150" cy="150" r="1.5" fill="#fff" opacity="0.5"/>
    <circle cx="350" cy="120" r="1.5" fill="#c0c0c0" opacity="0.6"/>
    <circle cx="100" cy="350" r="2" fill="#ffd700" opacity="0.6"/>
    <circle cx="400" cy="380" r="1.5" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Masked Figure Icon -->
  <g transform="translate(256, 200)">
    <!-- Hooded cloak silhouette -->
    <path d="M0 -80
             C-60 -70 -90 -30 -90 20
             C-90 50 -80 80 -70 100
             L-50 100
             C-45 70 -35 50 -20 40
             L-15 100
             L15 100
             L20 40
             C35 50 45 70 50 100
             L70 100
             C80 80 90 50 90 20
             C90 -30 60 -70 0 -80 Z"
          fill="#1a2235" stroke="url(#purpleAccent)" stroke-width="3"/>

    <!-- Inner hood shadow -->
    <ellipse cx="0" cy="-10" rx="55" ry="65" fill="#0a0e1a"/>

    <!-- Mysterious eyes -->
    <g filter="url(#glow)">
      <ellipse cx="-22" cy="-20" rx="12" ry="6" fill="url(#goldGlow)"/>
      <ellipse cx="22" cy="-20" rx="12" ry="6" fill="url(#goldGlow)"/>
    </g>

    <!-- Eye shine/pupils -->
    <circle cx="-22" cy="-20" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="22" cy="-20" r="3" fill="#fff" opacity="0.8"/>

    <!-- Mask/veil covering lower face -->
    <path d="M-40 -5
             Q-45 20 -35 45
             Q-20 60 0 65
             Q20 60 35 45
             Q45 20 40 -5
             Q30 0 0 5
             Q-30 0 -40 -5 Z"
          fill="url(#purpleAccent)" opacity="0.9" stroke="#818cf8" stroke-width="2"/>

    <!-- Veil pattern lines -->
    <path d="M-25 10 Q0 25 25 10" fill="none" stroke="#0a0e1a" stroke-width="2" opacity="0.5"/>
    <path d="M-20 25 Q0 35 20 25" fill="none" stroke="#0a0e1a" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Question mark accent (representing the mystery/guessing game) -->
  <g transform="translate(360, 140)" filter="url(#glow)">
    <text font-family="Cairo, sans-serif" font-size="50" font-weight="bold" fill="url(#goldGlow)">؟</text>
  </g>

  <!-- Game Title -->
  <text x="256" y="380" text-anchor="middle" fill="url(#goldGlow)" filter="url(#glow)"
        font-family="Cairo, 'Noto Kufi Arabic', sans-serif" font-size="72" font-weight="900">
    ملثم
  </text>

  <!-- Subtitle -->
  <text x="256" y="420" text-anchor="middle" fill="#8b95a5"
        font-family="Cairo, 'Noto Kufi Arabic', sans-serif" font-size="24" font-weight="500">
    يا قافط .. يا مقفوط
  </text>
</svg>
